      ${st < 0 ? html`<span class="bad">O restaurante cancelou este pedido. Chame o garçom se tiver dúvida.</span>` : html`
      <div class="steps">${STAGES.map((s, k) => html`<div key=${k} class=${'step ' + (k < st || st === 3 ? 'done' : k === st ? 'now' : '')}><i></i>${s[0]}</div>`)}</div>
      <small class="muted">${st === 3 ? 'Bom apetite!' : `Previsão: cerca de ${o.prep} min${o.live ? ' · atualizado pela cozinha' : ''}`}</small>`}
    </div>`; })}
    ${sendErr && html`<span class="bad">${sendErr}</span>`}

    ${lines.length === 0 ? html`<div class="empty">${placed ? 'Quer pedir mais alguma coisa? É só escolher no cardápio.' : 'Seu pedido está vazio. Toque num prato para começar.'}</div>
      ${placed && html`<button class="ghost" onClick=${onBill}>Pedir a conta</button>`}` : !review ? html`
      <div class="group" style=${{ padding: '4px 14px' }}>
        ${lines.map(l => html`<div class="line" key=${l.key}>
          <${Plate} item=${l.item}/>
          <div class="info"><b>${l.item.name}</b>${l.opts && html`<small>${l.opts}</small>`}${l.note && html`<small>Obs.: ${l.note}</small>`}
            <button class="muted" style=${{ fontSize: 12.5, textDecoration: 'underline', padding: 0, marginTop: 4 }} onClick=${() => onEdit(l)}>Editar</button></div>
          <div style=${{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
            <span class="price" style=${{ fontSize: 15 }}>${money(l.unit * l.qty)}</span>
            <div class="stepper sm"><button onClick=${() => onQty(l.key, -1)} aria-label="Menos">−</button><b>${l.qty}</b><button onClick=${() => onQty(l.key, 1)} aria-label="Mais">+</button></div>
          </div>
        </div>`)}
      </div>
      <div class="group">
        <div class="group-h"><b>Cupom</b>${coupon && html`<span class="ok">${COUPONS[coupon].label} aplicado</span>`}</div>
        <div class="inline"><input type="text" id="coupon" placeholder="Ex.: BRASA10" value=${code} onInput=${e => setCode(e.target.value)} onKeyDown=${e => e.key === 'Enter' && applyCoupon()}/><button class="ghost" onClick=${applyCoupon}>Aplicar</button></div>
        ${cErr && html`<span class="bad">${cErr}</span>`}
      </div>
      <div class="group">
        <label class="switch"><input type="checkbox" id="tip" checked=${tip} onChange=${e => setTip(e.target.checked)}/>Incluir serviço de 10% (opcional)</label>
        <div class="inline" style=${{ justifyContent: 'space-between', marginTop: 6 }}><span>Dividir a conta</span>
          <div class="stepper sm"><button onClick=${() => setSplit(s => Math.max(1, s - 1))} aria-label="Menos pessoas">−</button><b>${split}</b><button onClick=${() => setSplit(s => Math.min(20, s + 1))} aria-label="Mais pessoas">+</button></div></div>
      </div>
      <div class="rows">
        <div class="row"><span class="muted">Subtotal</span><span>${money(sub)}</span></div>
        ${disc > 0 && html`<div class="row"><span class="muted">Cupom ${coupon}</span><span class="ok">− ${money(disc)}</span></div>`}
        ${tip && html`<div class="row"><span class="muted">Serviço</span><span>${money(tipV)}</span></div>`}
        <div class="row total"><span>Total</span><span>${money(total)}</span></div>
        ${split > 1 && html`<div class="row"><span class="muted">${split} pessoas</span><b>${money(total / split)} cada</b></div>`}
        <small class="muted">Fica pronto em cerca de ${prep} min.</small>
      </div>
      <div class="addrow"><button class="primary" onClick=${() => setReview(true)}><span>Revisar pedido</span><span class="num">${money(total)}</span></button></div>
    ` : html`
      <div class="group"><div class="group-h"><b>Número da mesa</b></div>
        <div class="inline"><input type="text" id="table" inputmode="numeric" value=${table} onInput=${e => setTable(e.target.value.replace(/\D/g, '').slice(0, 3))} style=${{ textTransform: 'none' }}/></div>
        ${!table && html`<span class="bad">Informe a mesa para a cozinha saber onde entregar.</span>`}
      </div>
      <div class="group"><div class="group-h"><b>Mensagem para o garçom</b><span class="req">WhatsApp</span></div>
        <pre class="msg" id="msgbox">${msg}</pre>
        <div class="inline"><button class="ghost" onClick=${copy}>${copied ? 'Copiado' : 'Copiar texto'}</button>
          ${RESTAURANT.whats && html`<a class="ghost" style=${{ textDecoration: 'none', color: 'inherit' }} href=${`https://wa.me/${RESTAURANT.whats}?text=${encodeURIComponent(msg)}`} target="_blank" rel="noopener">Abrir no WhatsApp</a>`}</div>
        <small class="muted">${live ? 'O botão abaixo manda o pedido direto para o painel da cozinha. O WhatsApp fica como alternativa (número de demonstração).' : 'Demonstração: o número do WhatsApp é fictício e o envio para a cozinha é simulado.'}</small>
      </div>
      <div class="addrow"><button class="ghost" onClick=${() => setReview(false)}>Voltar</button>
        <button class="primary" disabled=${!table || sending} onClick=${async () => {
          setSending(true);
          const ok = await onPlace({ total, prep, sums, coupon, itens: lines.map(l => ({ id: l.id, nome: l.item.name, qtd: l.qty, opcoes: l.opts || '', obs: l.note || '', valor: Math.round(l.unit * l.qty * 100) / 100 })) });
          setSending(false); if (ok) setReview(false);
        }}><span>${sending ? 'Enviando…' : 'Enviar para a cozinha'}</span><span class="num">${money(total)}</span></button></div>
    `}
  </div><//>`;
}

/* ---------- App ---------- */
const mesaFromHash = () => { const m = /^#mesa-(\d{1,3})$/.exec(location.hash); return m ? m[1] : null; };

function MenuApp({ caps, config }) {
  const db = caps.db;
  const [query, setQuery] = useState('');
  const [filters, setFilters] = useState([]);
  const [onlyFav, setOnlyFav] = useState(false);
  const [sort, setSort] = useState('rel');
  const [active, setActive] = useState(null);
  const [open, setOpen] = useState(null); // {item, edit}
  const [cartAll, setCart] = useState(() => store.get('bm-cart', []));
  const cart = config.ready ? cartAll.filter(l => byId[l.id]) : [];
  const [cartOpen, setCartOpen] = useState(false);
  const [quiz, setQuiz] = useState(false);
  const [favs, setFavs] = useState(() => store.get('bm-favs', ['picanha']));
  const [table, setTable] = useState(() => mesaFromHash() || store.get('bm-table', '12'));
  const [localOrders, setLocalOrders] = useState([]);
  const [myIds, setMyIds] = useState(() => store.get('bm-my-orders', []).filter(m => Date.now() - m.at < 12 * 3600e3));
  const [liveMap, setLiveMap] = useState({});
  const [sendErr, setSendErr] = useState('');
  useEffect(() => store.set('bm-my-orders', myIds), [myIds]);
  useEffect(() => { const f = () => { const m = mesaFromHash(); if (m) setTable(m); }; addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const idsKey = myIds.map(m => m.id).join();
  useEffect(() => {
    if (!db || !idsKey) return;
    const unsubs = idsKey.split(',').map(id => db.doc('pedidos/' + id).onSnapshot(s => {
      if (s.exists) setLiveMap(m => ({ ...m, [id]: s.data() }));
    }, () => {}));
    return () => unsubs.forEach(u => u());
  }, [db, idsKey]);
  const orders = db ? myIds.filter(m => liveMap[m.id]).map(m => ({ ...liveMap[m.id], id: m.id, live: true })) : localOrders;
  const [now, setNow] = useState(Date.now());
  const [toast, setToast] = useState('');
  const [waiterAt, setWaiterAt] = useState(0);
  const [theme, setTheme] = useState(() => store.get('bm-theme', null));
  const hh = isHH(new Date(now));

  useEffect(() => store.set('bm-cart', cartAll), [cartAll]);
  useEffect(() => store.set('bm-favs', favs), [favs]);
  useEffect(() => store.set('bm-table', table), [table]);
  useEffect(() => { if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme; store.set('bm-theme', theme); }, [theme]);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const say = useCallback(m => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(''), 2600); }, []);

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
    let list = ITEMS.filter(i => {
      const hay = (i.name + ' ' + i.desc).toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
      return !isHidden(i) && (!q || hay.includes(q)) && filters.every(f => i.tags.includes(f) || (f === 'veg' && i.tags.includes('vegan'))) && (!onlyFav || favs.includes(i.id));
    });
    if (sort === 'asc') list = [...list].sort((a, b) => basePrice(a, hh) - basePrice(b, hh));
    if (sort === 'desc') list = [...list].sort((a, b) => basePrice(b, hh) - basePrice(a, hh));
    if (sort === 'prep') list = [...list].sort((a, b) => a.prep - b.prep);
    return list;
  }, [query, filters, onlyFav, favs, sort, hh, config.rev]);
  const grouped = CATS.map(c => ({ ...c, items: visible.filter(i => i.cat === c.id) })).filter(c => c.items.length);

  useEffect(() => {
    const obs = new IntersectionObserver(es => { es.forEach(e => e.isIntersecting && setActive(e.target.dataset.cat)); }, { rootMargin: '-90px 0px -65% 0px' });
    document.querySelectorAll('section.catsec').forEach(s => obs.observe(s));
    return () => obs.disconnect();
  }, [grouped.map(g => g.id).join()]);

  const qtyOf = id => cart.filter(l => l.id === id).reduce((a, l) => a + l.qty, 0);
  const count = cart.reduce((a, l) => a + l.qty, 0);
  const total = cart.reduce((a, l) => { const it = byId[l.id]; return a + (basePrice(it, hh) + optPrice(it, l.sel)) * l.qty; }, 0);

  const add = (entry, editKey) => {
    setCart(c => {
      if (editKey) return c.map(l => l.key === editKey ? { ...l, ...entry } : l);
      const sig = entry.id + JSON.stringify(entry.sel) + entry.note;
      const ex = c.find(l => l.id + JSON.stringify(l.sel) + l.note === sig);
      if (ex) return c.map(l => l === ex ? { ...l, qty: l.qty + entry.qty } : l);
      return [...c, { ...entry, key: Math.random().toString(36).slice(2, 9) }];
    });
    setOpen(null);
    say(editKey ? 'Item atualizado' : `${byId[entry.id].name} no pedido`);
  };
  const onQty = (key, d) => setCart(c => c.flatMap(l => l.key !== key ? [l] : l.qty + d <= 0 ? [] : [{ ...l, qty: l.qty + d }]));
  const toggleFav = (e, id) => { e.stopPropagation(); setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]); };
  const place = async o => {
    setSendErr('');
    const at = Date.now(); const num = String(at).slice(-4);
    if (!db) { setLocalOrders(l => [...l, { id: num, num, total: o.total, prep: o.prep, at }]); setCart([]); say('Pedido enviado (simulação)'); return true; }
    const ref = db.collection('pedidos').doc();
    const body = { num, mesa: table, itens: o.itens, subtotal: o.sums.sub, desconto: o.sums.disc, servico: o.sums.tip, total: Math.round(o.total * 100) / 100, cupom: o.coupon || '', prep: o.prep, status: 'novo', criadoEm: at };
    try {
      await ref.set(body);
      setLiveMap(m => ({ ...m, [ref.id]: body })); setMyIds(ids => [...ids, { id: ref.id, at }]);
      setCart([]); say('Pedido enviado para a cozinha'); return true;
    } catch (e) {
      setSendErr(e && (e.code === 'permission_denied' || e.code === 'not_granted')
        ? 'Seu acesso a esta página não permite enviar pedidos. Peça ao restaurante acesso de colaborador ou chame o garçom.'
        : 'Não deu para enviar agora. Confira a internet e tente de novo, ou chame o garçom.');
      return false;
    }
  };
  const chamar = async tipo => {
    if (!db) return true;
    try { await db.collection('chamados').add({ mesa: table || '?', tipo, em: Date.now(), resolvido: false }); return true; }
    catch { say('Não deu para avisar a equipe. Tente de novo em instantes.'); return false; }
  };
  const waiterWait = Math.max(0, 60 - Math.floor((now - waiterAt) / 1000));
  const callWaiter = async () => { if (await chamar('garcom')) { setWaiterAt(Date.now()); say(`Garçom chamado para a mesa ${table || '—'}`); } };

  const d = new Date(now); const pad = n => String(n).padStart(2, '0');
  const target = new Date(d); if (hh) target.setHours(RESTAURANT.hhEnd, 0, 0, 0); else { target.setHours(RESTAURANT.hhStart, 0, 0, 0); if (d.getHours() >= RESTAURANT.hhEnd) target.setDate(target.getDate() + 1); }
  const left = Math.max(0, Math.floor((target - d) / 1000));
  const clock = `${pad(Math.floor(left / 3600))}:${pad(Math.floor(left % 3600 / 60))}:${pad(left % 60)}`;
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const shown = ITEMS.filter(i => !isHidden(i) && !isOut(i));
  const hitPick = shown.find(i => i.tags.includes('hit')), newPick = shown.find(i => i.tags.includes('new') && i !== hitPick);
  const off = Math.round(RESTAURANT.hhOff * 100);
  const initials = RESTAURANT.sigla || RESTAURANT.name.split(/\s+/).filter(w => w.length > 2).map(w => w[0]).join('').slice(0, 3).toUpperCase();

  return html`
    <header class="wrap top">
      <div class="toprow">
        <div class="logo"><div class="mark">${initials}</div><div><h1>${RESTAURANT.name}</h1>${RESTAURANT.sub && html`<small>${RESTAURANT.sub}</small>`}</div></div>
        <div class="actions">
          <span class="pill table-tag">Mesa ${table || '—'}</span>
          <button class="pill" onClick=${callWaiter} disabled=${waiterWait > 0 && waiterAt > 0}>${waiterWait > 0 && waiterAt > 0 ? `Garçom a caminho · ${waiterWait}s` : 'Chamar garçom'}</button>
          <button class="pill" onClick=${() => setTheme(dark ? 'light' : 'dark')} aria-label="Alternar tema">${dark ? 'Claro' : 'Escuro'}</button>
        </div>
      </div>
      ${RESTAURANT.hhOn && off > 0 && CATS.some(c => c.hh) && html`<div class="hh">
        <div><b>${hh ? 'Happy hour rolando' : `Happy hour das ${RESTAURANT.hhStart}h às ${RESTAURANT.hhEnd}h`}</b><div style=${{ fontSize: 13 }}>${CATS.filter(c => c.hh).map(c => c.name).join(', ')} com ${off}% de desconto${hh ? ', preços já atualizados' : ''}</div></div>
        <div class="clock" aria-label=${hh ? 'Termina em' : 'Começa em'}><span style=${{ fontSize: 12, fontFamily: 'var(--f-body)', fontWeight: 600, marginRight: 6 }}>${hh ? 'termina em' : 'começa em'}</span>${clock}</div>
      </div>`}
      <div class="tools">
        <label class="search" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Buscar prato, ingrediente…" value=${query} onInput=${e => setQuery(e.target.value)}/></label>
        <div class="chips">
          <button class="chip" aria-pressed=${onlyFav} onClick=${() => setOnlyFav(v => !v)}>Favoritos ${favs.length ? `(${favs.length})` : ''}</button>
          ${['hit', 'veg', 'vegan', 'sg', 'hot', 'new'].map(t => html`<button key=${t} class="chip" aria-pressed=${filters.includes(t)} onClick=${() => setFilters(f => f.includes(t) ? f.filter(x => x !== t) : [...f, t])}>${TAGS[t]}</button>`)}
          <select class="sort" id="sort" value=${sort} onChange=${e => setSort(e.target.value)} aria-label="Ordenar">
            <option value="rel">Ordem da casa</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option><option value="prep">Mais rápido</option>
          </select>
        </div>
      </div>
    </header>

    <nav class="catbar"><div class="wrap cats">
      ${grouped.map(c => html`<button key=${c.id} class=${'cat' + (active === c.id ? ' on' : '')} onClick=${() => document.getElementById('cat-' + c.id).scrollIntoView({ behavior: 'smooth' })}>${c.name}<span class="n">${c.items.length}</span></button>`)}
    </div></nav>

    <main class="wrap">
      ${!caps.ready ? html`<div class="empty">Carregando o cardápio…</div>`
        : !config.ready ? html`<div class="empty">${config.slow ? 'O cardápio está demorando para carregar. Confira a internet.' : 'Carregando o cardápio…'}</div>`
        : ITEMS.filter(i => !isHidden(i)).length === 0 ? html`<div class="note chefnote" style=${{ marginTop: 16 }}><${Chef} size=${72} full=${true}/><p>${caps.canEdit ? html`O cardápio ainda está vazio. <a href="#painel">Abra o painel</a> e cadastre as categorias e os primeiros pratos.` : 'O restaurante ainda está montando o cardápio. Volte daqui a pouco.'}</p></div>` : ''}
      ${config.ready && ITEMS.length > 0 && !query && !filters.length && !onlyFav && html`<div class="featured">
        ${hitPick && html`<button class="feat" onClick=${() => setOpen({ item: hitPick })}><${Plate} item=${hitPick}/><div><small>Hit da casa</small><h3>${hitPick.name}</h3><span class="num">${money(basePrice(hitPick, hh))}</span></div></button>`}
        ${newPick && html`<button class="feat alt" onClick=${() => setOpen({ item: newPick })}><${Plate} item=${newPick}/><div><small>Novidade</small><h3>${newPick.name}</h3><span class="num">${money(basePrice(newPick, hh))}</span></div></button>`}
        <button class="feat quiz" onClick=${() => setQuiz(true)}><${Chef} size=${64} full=${true}/><div><small>Na dúvida?</small><h3>Me ajuda a escolher</h3><span style=${{ fontSize: 13, opacity: .8 }}>Duas perguntas e a gente monta seu combo</span></div></button>
      </div>`}

      ${config.ready && ITEMS.length > 0 && grouped.length === 0 && html`<div class="empty">Nenhum prato encontrado. Tente outra palavra ou tire algum filtro.</div>`}
      ${grouped.map(c => html`<section class="catsec" key=${c.id} id=${'cat-' + c.id} data-cat=${c.id}>
        <h2>${c.name}${c.hh && hh && html`<span>${off}% off no happy hour</span>`}</h2>
        <div class="grid">
          ${c.items.map(i => { const q = qtyOf(i.id); const p = basePrice(i, hh); const fav = favs.includes(i.id);
            return html`<div key=${i.id} class=${'card' + (isOut(i) ? ' out' : '')} role="button" tabindex="0" onClick=${() => setOpen({ item: i })} onKeyDown=${e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), setOpen({ item: i }))}>
              ${q > 0 && html`<span class="qbadge num">${q}</span>`}
              <${Plate} item=${i}/>
              <div class="body">
                <h3>${i.name}</h3><p>${i.desc}</p>
                <div class="meta">
                  <span class="price">${p !== listPrice(i) && html`<s>${money(listPrice(i))}</s>`}${money(p)}</span>
                  ${isOut(i) ? html`<span class="tag out">Esgotado</span>` : i.tags.filter(t => ['hit', 'new', 'hot', 'vegan', 'sg', 'veg'].includes(t)).slice(0, 2).map(t => html`<span key=${t} class=${'tag ' + (TAG_CLASS[t] || '')}>${TAGS[t]}</span>`)}
                  <span class="tag num">${i.prep} min</span>
                </div>
              </div>
              <button class="fav" aria-pressed=${fav} aria-label=${fav ? 'Tirar dos favoritos' : 'Favoritar'} onClick=${e => toggleFav(e, i.id)}><${Heart} on=${fav}/></button>
            </div>`; })}
        </div>
      </section>`)}
      <div class="madeby"><${Chef} size=${28}/><span>Cardápio digital por <b>MESALIVRE</b></span></div>
      ${caps.canEdit && html`<div class="foot"><a href="#painel">Abrir painel do restaurante</a></div>`}
      <div class="spacer"></div>
    </main>

    ${(count > 0 || orders.length > 0) && html`<div class="cartbar"><div class="wrap"><button class="cartbtn" onClick=${() => setCartOpen(true)}>
      ${count > 0 ? html`<span class="count">${count}</span><span>Ver pedido</span><span class="tot">${money(total)}</span>` : html`<span>Acompanhar pedido #${orders[orders.length - 1].num || orders[orders.length - 1].id}</span><span class="tot">${stageLabel(orders[orders.length - 1], now)}</span>`}
    </button></div></div>`}

    ${open && html`<${ItemSheet} key=${open.item.id + (open.edit ? open.edit.key : '')} item=${open.item} edit=${open.edit} hh=${hh} onClose=${() => setOpen(null)} onOpen=${it => setOpen({ item: it })} onAdd=${e => add(e, open.edit && open.edit.key)}/>`}
    ${quiz && html`<${QuizSheet} hh=${hh} onClose=${() => setQuiz(false)} onOpen=${it => { setQuiz(false); setOpen({ item: it }); }}/>`}
    ${cartOpen && html`<${CartSheet} cart=${cart} hh=${hh} table=${table} setTable=${setTable} orders=${orders} now=${now}
      onQty=${onQty} onClose=${() => setCartOpen(false)} onEdit=${l => { setCartOpen(false); setOpen({ item: byId[l.id], edit: l }); }}
      onPlace=${place} sendErr=${sendErr} live=${!!db} onBill=${async () => { if (await chamar('conta')) { say(`Conta solicitada para a mesa ${table}`); setCartOpen(false); } }}/>`}
    ${toast && html`<div class="toast" role="status">${toast}</div>`}
  `;
}

/* ================= Painel do restaurante (#painel) ================= */
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

function useThemeToggle() {
  const [theme, setTheme] = useState(() => store.get('bm-theme', null));
  useEffect(() => { if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme; store.set('bm-theme', theme); }, [theme]);
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  return [dark, () => setTheme(dark ? 'light' : 'dark')];
}

function Ticket({ o, now, onMove, onCancel, fresh }) {
  const [confirm, setConfirm] = useState(false);
  const age = now - o.criadoEm; const late = (o.status === 'novo' || o.status === 'cozinha') && age > (o.prep + 5) * 60e3;
  const next = { novo: ['cozinha', 'Começar preparo'], cozinha: ['pronto', 'Marcar pronto'], pronto: ['entregue', 'Entregue na mesa'] }[o.status];
  return html`<article class=${`ticket st-${o.status}${late ? ' late' : ''}${fresh ? ' fresh' : ''}`}>
    <div class="t-h"><b>Mesa ${o.mesa}</b><span class=${'num ' + (late ? 'late-txt' : 'muted')}>#${o.num} · ${mmss(age)}</span></div>
    <ul class="t-items">${(o.itens || []).map((it, k) => html`<li key=${k}><b>${it.qtd}×</b> ${it.nome}${it.opcoes && html`<small>${it.opcoes}</small>`}${it.obs && html`<small class="obs">Obs.: ${it.obs}</small>`}</li>`)}</ul>
    <div class="row"><span class="muted">${late ? html`<span class="late-txt">Atrasado</span>` : `Meta: ${o.prep} min`}</span><span class="num">${money(o.total || 0)}</span></div>
    ${o.status !== 'entregue' && o.status !== 'cancelado' && (confirm
      ? html`<div class="t-act"><button class="ghost" onClick=${() => setConfirm(false)}>Manter</button><button class="primary" style=${{ background: 'var(--chili)', color: '#fff' }} onClick=${() => onCancel(o)}><span>Cancelar pedido</span></button></div>`
      : html`<div class="t-act">${next && html`<button class="primary" onClick=${() => onMove(o, next[0])}><span>${next[1]}</span><span>→</span></button>`}<button class="ghost" onClick=${() => setConfirm(true)} aria-label="Cancelar pedido">Cancelar</button></div>`)}
  </article>`;
}

/* ================= Cadastro do cardápio (painel → Cardápio) ================= */
const slug = t => (t || 'item').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'item';
const rid = () => Math.random().toString(36).slice(2, 7);
const toNum = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const TAG_HELP = { hit: 'o prato que mais sai ou mais recebe elogios', new: 'acabou de entrar no cardápio' };
const GROUP_TYPES = [['req1', 'Escolher 1 (obrigatório)', 1, 1], ['opt1', 'Escolher 1 (opcional)', 0, 1], ['multi', 'Escolher vários (opcional)', 0, 5]];
const groupType = g => g.min >= 1 ? 'req1' : g.max > 1 ? 'multi' : 'opt1';

async function resizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; });
    const max = 900, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.84));
  } finally { URL.revokeObjectURL(url); }
}

function emptyDraft(cat) {
  return { nome: '', desc: '', preco: '', cat: cat || '', selos: [], prep: 15, kcal: '', alergenos: '', esgotado: false, ativo: true, semHH: false, foto: null, grupos: [], combina: [], fome: 2, vibe: 'conforto' };
}
function draftFrom(item) {
  const d = item.raw || {};
  return { ...emptyDraft(item.cat), ...JSON.parse(JSON.stringify(d)), preco: String(d.preco ?? ''), kcal: d.kcal ? String(d.kcal) : '', prep: d.prep || 15, grupos: (d.grupos || []).map(g => ({ ...g, opcoes: (g.opcoes || []).map(o => ({ ...o, preco: String(o.preco || 0) })) })) };
}

function DishEditor({ db, assets, id, start, onClose, say }) {
  const [d, setD] = useState(start);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [photoBusy, setPhotoBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const uploaded = useRef([]);
  const set = patch => setD(x => ({ ...x, ...patch }));
  const toggleIn = (key, v) => setD(x => ({ ...x, [key]: x[key].includes(v) ? x[key].filter(t => t !== v) : [...x[key], v] }));
  const setGroup = (gi, patch) => setD(x => ({ ...x, grupos: x.grupos.map((g, k) => k === gi ? { ...g, ...patch } : g) }));
  const setOpt = (gi, oi, patch) => setD(x => ({ ...x, grupos: x.grupos.map((g, k) => k !== gi ? g : { ...g, opcoes: g.opcoes.map((o, j) => j === oi ? { ...o, ...patch } : o) }) }));
  const others = ITEMS.filter(i => i.id !== id);

  const pickPhoto = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type)) { setErr('Escolha um arquivo de imagem (JPG, PNG ou WEBP).'); return; }
    if (!assets) { setErr('O envio de fotos não está liberado para o seu acesso.'); return; }
    setPhotoBusy(true); setErr('');
    try {
      const blob = await resizeImage(file);
      const res = await assets.upload(blob);
      uploaded.current.push(res.id);
      set({ foto: IS_DEMO ? { id: res.id, url: res.url } : { id: res.id } });
    } catch (x) {
      setErr(x && x.code === 'quota_exceeded' ? 'O espaço para fotos acabou. Apague fotos de pratos antigos e tente de novo.' : 'Não deu para enviar a foto. Tente outra imagem ou tente de novo.');
    }
    setPhotoBusy(false);
  };
  const cleanupUploads = keepId => { uploaded.current.filter(x => x !== keepId).forEach(x => assets && assets.delete(x).catch(() => {})); uploaded.current = []; };
  const cancel = () => { cleanupUploads(null); onClose(); };

  const save = async () => {
    const preco = toNum(d.preco);
    if (!d.nome.trim()) return setErr('Dê um nome ao prato.');
    if (!(preco >= 0) || d.preco === '') return setErr('Digite o preço, por exemplo 42,90.');
    if (!d.cat) return setErr('Escolha a categoria do prato.');
    for (const g of d.grupos) {
      if (!g.nome.trim()) return setErr('Dê um nome para cada grupo de opções, por exemplo "Ponto da carne".');
      if (!g.opcoes.length || g.opcoes.some(o => !o.nome.trim())) return setErr(`Preencha as opções do grupo "${g.nome}".`);
      if (g.opcoes.some(o => isNaN(toNum(o.preco)))) return setErr(`Confira os preços das opções do grupo "${g.nome}".`);
    }
    setBusy(true); setErr('');
    const docId = id || `${slug(d.nome)}-${rid()}`;
    const old = id && byId[id] ? byId[id].fotoId : null;
    const body = {
      nome: d.nome.trim(), desc: d.desc.trim(), preco: Math.round(preco * 100) / 100, cat: d.cat,
      selos: d.selos, prep: Math.max(1, Number(d.prep) || 15), kcal: Number(d.kcal) || 0, alergenos: d.alergenos.trim(),
      esgotado: !!d.esgotado, ativo: d.ativo !== false, semHH: !!d.semHH, foto: d.foto && d.foto.id ? (IS_DEMO && d.foto.url ? { id: d.foto.id, url: d.foto.url } : { id: d.foto.id }) : null,
      combina: d.combina.filter(x => byId[x]).slice(0, 4), fome: Number(d.fome) || 2, vibe: d.vibe || 'conforto',
      cores: Array.isArray(d.cores) ? d.cores : DEFAULT_COLORS[Math.floor(Math.random() * DEFAULT_COLORS.length)],
      ordem: id ? (Number(d.ordem) || 0) : ITEMS.filter(i => i.cat === d.cat).length,
      grupos: d.grupos.map(g => ({ id: g.id, nome: g.nome.trim(), min: g.min, max: g.max, opcoes: g.opcoes.map(o => ({ id: o.id, nome: o.nome.trim(), preco: Math.round(toNum(o.preco) * 100) / 100 })) })),
    };
    try {
      await db.doc('pratos/' + docId).set(body);
      cleanupUploads(body.foto && body.foto.id);
      if (old && old !== (body.foto && body.foto.id) && assets) assets.delete(old).catch(() => {});
      say(id ? 'Prato atualizado no cardápio' : 'Prato adicionado ao cardápio');
      onClose();
    } catch { setErr('Não deu para salvar. Confira a internet e tente de novo.'); }
    setBusy(false);
  };
  const remove = async () => {
    setBusy(true);
    try {
      await db.doc('pratos/' + id).delete();
      const f = byId[id] && byId[id].fotoId; if (f && assets) assets.delete(f).catch(() => {});
      cleanupUploads(null); say('Prato apagado'); onClose();
    } catch { setErr('Não deu para apagar. Tente de novo.'); setBusy(false); }
  };

  const preview = toItem(id || 'novo', { ...d, preco: toNum(d.preco) || 0 });
  return html`<${Sheet} onClose=${cancel} label=${id ? 'Editar prato' : 'Novo prato'}><div class="sheet-in">
    <div class="sheet-head"><h2>${id ? 'Editar prato' : 'Novo prato'}</h2><button class="x" onClick=${cancel} aria-label="Fechar"><${Close}/></button></div>

    <div class="photo-row">
      <${Plate} item=${preview} cls="lg"/>
      <div class="rows" style=${{ flex: 1, minWidth: 0 }}>
        <b>Foto do prato</b>
        <small class="muted">Use uma foto de cima, bem iluminada. A gente reduz o tamanho automaticamente. Sem foto, aparece um prato ilustrado.</small>
        <div class="inline">
          <label class="ghost filebtn" for="foto-input">${photoBusy ? 'Enviando foto…' : d.foto ? 'Trocar foto' : 'Escolher foto'}</label>
          <input id="foto-input" type="file" accept="image/*" hidden onChange=${pickPhoto} disabled=${photoBusy}/>
          ${d.foto && html`<button class="ghost" onClick=${() => set({ foto: null })}>Remover foto</button>`}
        </div>
      </div>
    </div>

    <div class="group form">
      <label for="f-nome">Nome do prato</label>
      <input id="f-nome" type="text" maxlength="60" value=${d.nome} onInput=${e => set({ nome: e.target.value })} placeholder="Ex.: Filé à parmegiana"/>
      <label for="f-desc">Descrição</label>
      <textarea id="f-desc" maxlength="180" value=${d.desc} onInput=${e => set({ desc: e.target.value })} placeholder="Ingredientes e acompanhamentos, em uma ou duas frases"></textarea>
      <div class="form-2">
        <div><label for="f-preco">Preço (R$)</label><input id="f-preco" type="text" inputmode="decimal" value=${d.preco} onInput=${e => set({ preco: e.target.value })} placeholder="42,90"/></div>
        <div><label for="f-cat">Categoria</label><select id="f-cat" value=${d.cat} onChange=${e => set({ cat: e.target.value })}>
          <option value="">Escolha…</option>${CATS.map(c => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select></div>
        <div><label for="f-prep">Preparo (min)</label><input id="f-prep" type="number" min="1" value=${d.prep} onInput=${e => set({ prep: e.target.value })}/></div>
        <div><label for="f-kcal">Calorias (kcal)</label><input id="f-kcal" type="number" min="0" value=${d.kcal} onInput=${e => set({ kcal: e.target.value })} placeholder="opcional"/></div>
      </div>
      <label for="f-alerg">Alergênicos</label>
      <input id="f-alerg" type="text" maxlength="80" value=${d.alergenos} onInput=${e => set({ alergenos: e.target.value })} placeholder="Ex.: glúten, lactose, ovo"/>
    </div>

    <div class="group">
      <div class="group-h"><b>Selos</b><span class="req">Aparecem no card do prato</span></div>
      <div class="selos">${Object.keys(TAGS).map(t => html`<button key=${t} class=${'selo ' + (TAG_CLASS[t] || '')} aria-pressed=${d.selos.includes(t)} onClick=${() => toggleIn('selos', t)}>${TAGS[t]}${TAG_HELP[t] && html`<small>${TAG_HELP[t]}</small>`}</button>`)}</div>
    </div>

    <div class="group">
      <div class="group-h"><b>Disponibilidade</b></div>
      <label class="switch"><input type="checkbox" id="f-ativo" checked=${d.ativo !== false} onChange=${e => set({ ativo: e.target.checked })}/>Mostrar no cardápio</label>
      <label class="switch"><input type="checkbox" id="f-esg" checked=${!!d.esgotado} onChange=${e => set({ esgotado: e.target.checked })}/>Esgotado hoje</label>
      <label class="switch"><input type="checkbox" id="f-hh" checked=${!!d.semHH} onChange=${e => set({ semHH: e.target.checked })}/>Fora do desconto de happy hour</label>
    </div>

    <div class="group">
      <div class="group-h"><b>Opções e adicionais</b><span class="req">Ponto da carne, tamanho, extras</span></div>
      ${d.grupos.length === 0 && html`<small class="muted">Nenhuma opção. O cliente pede o prato do jeito que ele é.</small>`}
      ${d.grupos.map((g, gi) => html`<div class="optgroup" key=${g.id}>
        <div class="form-2">
          <div><label for=${'g-n-' + g.id}>Nome do grupo</label><input id=${'g-n-' + g.id} type="text" value=${g.nome} onInput=${e => setGroup(gi, { nome: e.target.value })} placeholder="Ex.: Adicionais"/></div>
          <div><label for=${'g-t-' + g.id}>Como o cliente escolhe</label><select id=${'g-t-' + g.id} value=${groupType(g)} onChange=${e => { const t = GROUP_TYPES.find(x => x[0] === e.target.value); setGroup(gi, { min: t[2], max: t[3] }); }}>
            ${GROUP_TYPES.map(t => html`<option key=${t[0]} value=${t[0]}>${t[1]}</option>`)}</select></div>
        </div>
        ${g.opcoes.map((o, oi) => html`<div class="optline" key=${o.id}>
          <input type="text" id=${'o-n-' + o.id} aria-label="Nome da opção" value=${o.nome} onInput=${e => setOpt(gi, oi, { nome: e.target.value })} placeholder="Ex.: Bacon"/>
          <input type="text" id=${'o-p-' + o.id} aria-label="Preço extra" inputmode="decimal" value=${o.preco} onInput=${e => setOpt(gi, oi, { preco: e.target.value })} placeholder="+ R$ 0"/>
          <button class="x" aria-label="Tirar opção" onClick=${() => setGroup(gi, { opcoes: g.opcoes.filter((_, j) => j !== oi) })}><${Close}/></button>
        </div>`)}
        <div class="inline"><button class="ghost" onClick=${() => setGroup(gi, { opcoes: [...g.opcoes, { id: rid(), nome: '', preco: '0' }] })}>+ Opção</button>
          <button class="linkbtn" onClick=${() => setD(x => ({ ...x, grupos: x.grupos.filter((_, k) => k !== gi) }))}>Apagar grupo</button></div>
      </div>`)}
      <div><button class="ghost" onClick=${() => setD(x => ({ ...x, grupos: [...x.grupos, { id: rid(), nome: '', min: 0, max: 5, opcoes: [{ id: rid(), nome: '', preco: '0' }] }] }))}>+ Grupo de opções</button></div>
    </div>

    <div class="group">
      <div class="group-h"><b>Combina com</b><span class="req">Até 4 sugestões</span></div>
      ${others.length === 0 ? html`<small class="muted">Cadastre outros pratos para sugerir combinações.</small>` : html`<div class="selos">${others.map(o => html`<button key=${o.id} class="selo" aria-pressed=${d.combina.includes(o.id)} disabled=${!d.combina.includes(o.id) && d.combina.length >= 4} onClick=${() => toggleIn('combina', o.id)}>${o.name}</button>`)}</div>`}
    </div>

    <div class="group form">
      <div class="group-h"><b>Para o "Me ajuda a escolher"</b></div>
      <div class="form-2">
        <div><label for="f-fome">Tamanho da fome</label><select id="f-fome" value=${d.fome} onChange=${e => set({ fome: Number(e.target.value) })}><option value="1">Beliscar</option><option value="2">Fome boa</option><option value="3">Faminto</option></select></div>
        <div><label for="f-vibe">Vibe</label><select id="f-vibe" value=${d.vibe} onChange=${e => set({ vibe: e.target.value })}><option value="conforto">Conforto</option><option value="fresco">Fresquinho</option><option value="ousado">Ousado</option></select></div>
      </div>
    </div>

    ${err && html`<span class="bad" role="alert">${err}</span>`}
    ${confirmDel ? html`<div class="addrow"><span style=${{ flex: 1 }}>Apagar "${d.nome}" do cardápio? Não dá para desfazer.</span><button class="ghost" onClick=${() => setConfirmDel(false)}>Manter</button><button class="primary danger" style=${{ flex: 'none' }} disabled=${busy} onClick=${remove}><span>Apagar</span></button></div>`
      : html`<div class="addrow">${id && html`<button class="ghost" onClick=${() => setConfirmDel(true)}>Apagar</button>`}<button class="ghost" onClick=${cancel}>Cancelar</button>
        <button class="primary" disabled=${busy || photoBusy} onClick=${save}><span>${busy ? 'Salvando…' : id ? 'Salvar alterações' : 'Adicionar ao cardápio'}</span><span>✓</span></button></div>`}
  </div><//>`;
}

function Cadastro({ db, assets, config, orders, say }) {
  const [sub, setSub] = useState('pratos');
  const [editing, setEditing] = useState(null);
  const [newCat, setNewCat] = useState('');
  const [catDel, setCatDel] = useState(null);
  const cfg = config.cfg || {};
  const [rest, setRest] = useState(null);
  const r0 = cfg.restaurante || {};
  const R = rest || { nome: r0.nome || '', sigla: r0.sigla || '', sub: r0.sub || '', whats: r0.whats || '', hhOn: !!r0.hhOn, hhInicio: r0.hhInicio ?? 17, hhFim: r0.hhFim ?? 20, hhDesc: r0.hhDesc ?? 20 };

  const saveCfg = async (patch, msg) => {
    try { await db.doc('config/menu').set({ ...cfg, ...patch }); say(msg || 'Salvo'); return true; }
    catch { say('Não deu para salvar. Tente de novo.'); return false; }
  };
  const cats = Array.isArray(cfg.cats) ? cfg.cats : [];
  const patchDish = async (it, patch, msg) => { try { await db.doc('pratos/' + it.id).update(patch); if (msg) say(msg); } catch { say('Não deu para salvar. Tente de novo.'); } };
  const moveDish = async (it, dir) => {
    const list = ITEMS.filter(i => i.cat === it.cat); const k = list.indexOf(it), j = k + dir;
    if (j < 0 || j >= list.length) return;
    const re = list.slice(); [re[k], re[j]] = [re[j], re[k]];
    try { await Promise.all(re.map((x, n) => x.ordem === n ? null : db.doc('pratos/' + x.id).update({ ordem: n }))); } catch { say('Não deu para reordenar.'); }
  };

  const weekAgo = Date.now() - 7 * 864e5;
  const sold = {}; orders.filter(o => o.criadoEm >= weekAgo && o.status !== 'cancelado').forEach(o => (o.itens || []).forEach(x => { sold[x.id] = (sold[x.id] || 0) + (x.qtd || 0); }));
  const best = Object.entries(sold).filter(([k]) => byId[k]).sort((a, b) => b[1] - a[1])[0];
  const bestItem = best && byId[best[0]];

  const SUBS = [['pratos', `Pratos (${ITEMS.length})`], ['categorias', `Categorias (${cats.length})`], ['restaurante', 'Restaurante']];
  return html`<section class="panel-sec">
    <div class="ptabs sub">${SUBS.map(([k, l]) => html`<button key=${k} class=${'ptab' + (sub === k ? ' on' : '')} onClick=${() => setSub(k)}>${l}</button>`)}</div>

    ${sub === 'pratos' && html`
      <div class="inline" style=${{ justifyContent: 'space-between' }}>
        <h2>Pratos do cardápio</h2>
        <button class="primary" style=${{ flex: 'none' }} disabled=${!cats.length} onClick=${() => setEditing({ id: null, start: emptyDraft(cats[0] && cats[0].id) })}><span>+ Novo prato</span></button>
      </div>
      ${!cats.length && html`<div class="note">Antes do primeiro prato, crie as categorias do cardápio (Entradas, Pratos, Bebidas…) na aba Categorias.</div>`}
      ${bestItem && !bestItem.tags.includes('hit') && html`<div class="note chefnote hitnote"><${Chef} size=${48}/><p><b>${bestItem.name}</b> foi o prato mais vendido dos últimos 7 dias (${best[1]} pedidos). Que tal marcar como Hit da casa?</p>
        <button class="primary" style=${{ flex: 'none' }} onClick=${() => patchDish(bestItem, { selos: [...bestItem.tags, 'hit'] }, 'Selo Hit da casa adicionado')}><span>★ Marcar como Hit</span></button></div>`}
      ${cats.length > 0 && ITEMS.length === 0 && html`<div class="note chefnote"><${Chef} size=${64} full=${true}/><p>Nenhum prato ainda. Toque em "Novo prato" para cadastrar o primeiro, com foto, preço, selos e adicionais.</p></div>`}
      ${[...cats.map(c => ({ id: c.id, name: c.nome })), ...(ITEMS.some(i => !cats.some(c => c.id === i.cat)) ? [{ id: '__sem', name: 'Sem categoria (não aparecem no cardápio)' }] : [])].map(c => {
        const list = ITEMS.filter(i => c.id === '__sem' ? !cats.some(x => x.id === i.cat) : i.cat === c.id);
        if (!list.length) return null;
        return html`<div key=${c.id} class="dishcat"><h3>${c.name}</h3>
          ${list.map((it, k) => html`<div class=${'dishrow' + (it.hidden ? ' off' : '')} key=${it.id}>
            <${Plate} item=${it}/>
            <div class="info"><b>${it.name}</b>
              <div class="meta"><span class="price" style=${{ fontSize: 15 }}>${money(it.price)}</span>${it.tags.map(t => html`<span key=${t} class=${'tag ' + (TAG_CLASS[t] || '')}>${TAGS[t]}</span>`)}</div>
              <small class="muted">${sold[it.id] ? `${sold[it.id]} vendidos em 7 dias` : 'Sem vendas em 7 dias'}${it.groups.length ? ` · ${it.groups.length} grupo(s) de opções` : ''}${it.foto ? '' : ' · sem foto'}</small>
            </div>
            <div class="dishact">
              <label class="switch"><input type="checkbox" id=${'esg-' + it.id} checked=${it.soldOut} onChange=${e => patchDish(it, { esgotado: e.target.checked }, e.target.checked ? 'Marcado como esgotado' : 'Disponível de novo')}/>Esgotado</label>
              <label class="switch"><input type="checkbox" id=${'vis-' + it.id} checked=${!it.hidden} onChange=${e => patchDish(it, { ativo: e.target.checked }, e.target.checked ? 'Prato visível' : 'Prato escondido')}/>No cardápio</label>
              <div class="inline">
                <button class="ghost sm" aria-label="Subir" disabled=${k === 0} onClick=${() => moveDish(it, -1)}>↑</button>
                <button class="ghost sm" aria-label="Descer" disabled=${k === list.length - 1} onClick=${() => moveDish(it, 1)}>↓</button>
                <button class="ghost sm" onClick=${() => setEditing({ id: it.id, start: draftFrom(it) })}>Editar</button>
              </div>
            </div>
          </div>`)}
        </div>`; })}
    `}

    ${sub === 'categorias' && html`
      <h2>Categorias</h2>
      <div class="note">A ordem aqui é a ordem das abas no cardápio. Marque "Happy hour" nas categorias que ganham desconto no horário.</div>
      <div class="rows">${cats.map((c, k) => { const n = ITEMS.filter(i => i.cat === c.id).length;
        return html`<div class="catrow" key=${c.id}>
          <input type="text" id=${'cat-n-' + c.id} aria-label="Nome da categoria" defaultValue=${c.nome} onBlur=${e => { const v = e.target.value.trim(); if (v && v !== c.nome) saveCfg({ cats: cats.map(x => x.id === c.id ? { ...x, nome: v } : x) }, 'Categoria renomeada'); }}/>
          <small class="muted num">${n} prato${n === 1 ? '' : 's'}</small>
          <label class="switch"><input type="checkbox" id=${'cat-hh-' + c.id} checked=${!!c.hh} onChange=${e => saveCfg({ cats: cats.map(x => x.id === c.id ? { ...x, hh: e.target.checked } : x) })}/>Happy hour</label>
          <button class="ghost sm" aria-label="Subir" disabled=${k === 0} onClick=${() => { const re = cats.slice(); [re[k - 1], re[k]] = [re[k], re[k - 1]]; saveCfg({ cats: re }); }}>↑</button>
          <button class="ghost sm" aria-label="Descer" disabled=${k === cats.length - 1} onClick=${() => { const re = cats.slice(); [re[k + 1], re[k]] = [re[k], re[k + 1]]; saveCfg({ cats: re }); }}>↓</button>
          ${catDel === c.id ? html`<button class="ghost sm danger-t" onClick=${() => { setCatDel(null); saveCfg({ cats: cats.filter(x => x.id !== c.id) }, 'Categoria apagada'); }}>Confirmar</button>`
            : html`<button class="ghost sm" disabled=${n > 0} title=${n > 0 ? 'Mova ou apague os pratos desta categoria antes' : ''} onClick=${() => setCatDel(c.id)}>Apagar</button>`}
        </div>`; })}</div>
      ${cats.some(c => ITEMS.some(i => i.cat === c.id)) && html`<small class="muted">Só dá para apagar uma categoria vazia.</small>`}
      <form class="inline" onSubmit=${e => { e.preventDefault(); const v = newCat.trim(); if (!v) return; saveCfg({ cats: [...cats, { id: slug(v) + '-' + rid(), nome: v, hh: false }] }, 'Categoria criada'); setNewCat(''); }}>
        <input type="text" id="new-cat" class="grow" value=${newCat} onInput=${e => setNewCat(e.target.value)} placeholder="Nova categoria, ex.: Sobremesas" maxlength="30"/>
        <button class="primary" style=${{ flex: 'none' }} type="submit"><span>+ Criar</span></button>
      </form>
    `}

    ${sub === 'restaurante' && html`
      <h2>Dados do restaurante</h2>
      <div class="group form">
        <div class="form-2">
          <div><label for="r-nome">Nome</label><input id="r-nome" type="text" maxlength="40" value=${R.nome} onInput=${e => setRest({ ...R, nome: e.target.value })}/></div>
          <div><label for="r-sigla">Sigla do logo (até 3 letras)</label><input id="r-sigla" type="text" maxlength="3" value=${R.sigla} onInput=${e => setRest({ ...R, sigla: e.target.value.toUpperCase() })}/></div>
        </div>
        <label for="r-sub">Frase curta</label><input id="r-sub" type="text" maxlength="60" value=${R.sub} onInput=${e => setRest({ ...R, sub: e.target.value })} placeholder="Ex.: Cozinha caseira · aberto até 23h"/>
        <label for="r-whats">WhatsApp do restaurante (com DDD)</label><input id="r-whats" type="text" inputmode="tel" value=${R.whats} onInput=${e => setRest({ ...R, whats: e.target.value })} placeholder="Ex.: 55 11 91234-5678"/>
      </div>
      <div class="group form">
        <label class="switch"><input type="checkbox" id="r-hh" checked=${R.hhOn} onChange=${e => setRest({ ...R, hhOn: e.target.checked })}/>Tem happy hour</label>
        ${R.hhOn && html`<div class="form-2">
          <div><label for="r-hi">Começa (hora)</label><input id="r-hi" type="number" min="0" max="23" value=${R.hhInicio} onInput=${e => setRest({ ...R, hhInicio: e.target.value })}/></div>
          <div><label for="r-hf">Termina (hora)</label><input id="r-hf" type="number" min="1" max="24" value=${R.hhFim} onInput=${e => setRest({ ...R, hhFim: e.target.value })}/></div>
          <div><label for="r-hd">Desconto (%)</label><input id="r-hd" type="number" min="1" max="90" value=${R.hhDesc} onInput=${e => setRest({ ...R, hhDesc: e.target.value })}/></div>
        </div><small class="muted">O desconto vale para as categorias marcadas com "Happy hour".</small>`}
      </div>
      <div class="addrow"><button class="primary" disabled=${!R.nome.trim()} onClick=${async () => {
        const hi = Number(R.hhInicio), hf = Number(R.hhFim);
        if (R.hhOn && !(hi >= 0 && hf > hi && hf <= 24)) { say('Confira o horário: o fim precisa ser depois do início.'); return; }
        if (await saveCfg({ restaurante: { nome: R.nome.trim(), sigla: R.sigla.trim(), sub: R.sub.trim(), whats: R.whats.trim(), hhOn: R.hhOn, hhInicio: hi, hhFim: hf, hhDesc: Number(R.hhDesc) || 0 } }, 'Dados do restaurante salvos')) setRest(null);
      }}><span>Salvar dados do restaurante</span><span>✓</span></button></div>
    `}

    ${editing && html`<${DishEditor} key=${editing.id || 'novo'} db=${db} assets=${assets} id=${editing.id} start=${editing.start} say=${say} onClose=${() => setEditing(null)}/>`}
  </section>`;
}

function Panel({ caps, config }) {
  const db = caps.db;
  const [tab, setTab] = useState('pedidos');
  const [orders, setOrders] = useState(null);
  const [calls, setCalls] = useState([]);
  const [slow, setSlow] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [fresh, setFresh] = useState({});
  const [sound, setSound] = useState(false);
  const [toast, setToast] = useState('');
  const [drafts, setDrafts] = useState({});
  const [purge, setPurge] = useState(false);
  const [dark, toggleTheme] = useThemeToggle();
  const audio = useRef(null); const seen = useRef(null); const soundRef = useRef(false);
  soundRef.current = sound;
  const say = m => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(''), 2400); };
  const beep = () => { const ac = audio.current; if (!ac) return; [0, .18].forEach(d => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.18, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d + .15); o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .16); }); };

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (!db || !caps.canEdit) return;
    const timer = setTimeout(() => setSlow(true), 10000);
    const u1 = db.collection('pedidos').orderBy('criadoEm', 'desc').limit(300).onSnapshot(s => {
      if (!s.metadata || !s.metadata.fromCache) { clearTimeout(timer); setSlow(false); }
      const list = s.docs.map(d => ({ ...d.data(), id: d.id }));
      if (seen.current) {
        const novos = list.filter(o => o.status === 'novo' && !seen.current.has(o.id));
        if (novos.length) { if (soundRef.current) beep(); setFresh(f => { const n = { ...f }; novos.forEach(o => n[o.id] = true); return n; }); }
      }
      seen.current = new Set(list.map(o => o.id));
      setOrders(list);
    }, () => { clearTimeout(timer); setOrders(o => o || []); setSlow(true); });
    const u2 = db.collection('chamados').orderBy('em', 'desc').limit(100).onSnapshot(s => {
      setCalls(s.docs.map(d => ({ ...d.data(), id: d.id })));
    }, () => {});
    return () => { clearTimeout(timer); u1(); u2(); };
  }, [db, caps.canEdit]);

  const header = html`<header class="wrap ptop">
    <div class="logo"><${Chef} size=${48}/><div><h1 class="ml-word">MESALIVRE</h1><small>Painel · ${RESTAURANT.name}</small></div></div>
    <div class="actions">
      <a class="pill" href="#" style=${{ textDecoration: 'none', color: 'inherit' }}>Ver cardápio</a>
      ${caps.canEdit && db && html`<button class="pill" onClick=${() => { if (!audio.current) { try { audio.current = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } const v = !sound; setSound(v); if (v) setTimeout(beep, 50); }}>${sound ? 'Som ligado' : 'Ligar som de novo pedido'}</button>`}
      <button class="pill" onClick=${toggleTheme}>${dark ? 'Claro' : 'Escuro'}</button>
    </div>
  </header>`;

  if (!caps.ready) return html`${header}<div class="boot">Conectando ao painel…</div>`;
  if (!db) return html`${header}<main class="wrap panel-sec"><div class="note">Não foi possível carregar os dados do painel. Recarregue a página.</div></main>`;
  if (!caps.canEdit) return html`${header}<main class="wrap panel-sec"><div class="note">O painel é só para a equipe do restaurante. Entre com uma conta da equipe.</div></main>`;

  const all = orders || [];
  const today = all.filter(o => o.criadoEm >= startOfDay(now));
  const by = st => all.filter(o => o.status === st);
  const openCalls = calls.filter(c => !c.resolvido);
  const valid = today.filter(o => o.status !== 'cancelado');
  const revenue = valid.reduce((a, o) => a + (o.total || 0), 0);
  const timed = valid.filter(o => o.em_pronto);
  const avgPrep = timed.length ? timed.reduce((a, o) => a + (o.em_pronto - o.criadoEm), 0) / timed.length : 0;

  const move = async (o, st) => { try { await db.doc('pedidos/' + o.id).update({ status: st, ['em_' + st]: Date.now() }); setFresh(f => { const n = { ...f }; delete n[o.id]; return n; }); } catch { say('Não deu para atualizar. Tente de novo.'); } };
  const cancel = async o => { try { await db.doc('pedidos/' + o.id).update({ status: 'cancelado', em_cancelado: Date.now() }); say(`Pedido #${o.num} cancelado`); } catch { say('Não deu para cancelar. Tente de novo.'); } };
  const resolve = async c => { try { await db.doc('chamados/' + c.id).update({ resolvido: true, resolvidoEm: Date.now() }); } catch { say('Não deu para marcar como atendido.'); } };
  const saveConfig = async patch => {
    try { await db.doc('config/menu').set({ ...(config.cfg || {}), ...patch }); say('Salvo'); } catch { say('Não deu para salvar. Tente de novo.'); }
  };
  const doPurge = async () => {
    const old = all.filter(o => o.criadoEm < startOfDay(now)); const oldCalls = calls.filter(c => c.em < startOfDay(now));
    try { await Promise.all([...old.map(o => db.doc('pedidos/' + o.id).delete()), ...oldCalls.map(c => db.doc('chamados/' + c.id).delete())]); say(`${old.length} pedidos antigos apagados`); }
    catch { say('Alguns pedidos não foram apagados. Tente de novo.'); }
    setPurge(false);
  };

  const qtyByItem = {}; valid.forEach(o => (o.itens || []).forEach(it => { qtyByItem[it.nome] = (qtyByItem[it.nome] || 0) + it.qtd; }));
  const top = Object.entries(qtyByItem).sort((a, b) => b[1] - a[1]).slice(0, 6); const topMax = top.length ? top[0][1] : 1;
  const hours = Array.from({ length: 13 }, (_, k) => 11 + k).map(h => [h, valid.filter(o => new Date(o.criadoEm).getHours() === h).length]);
  const hMax = Math.max(1, ...hours.map(h => h[1]));

  const TABS = [['pedidos', 'Pedidos', by('novo').length], ['chamados', 'Chamados', openCalls.length], ['cardapio', 'Cardápio', 0], ['resumo', 'Resumo do dia', 0], ['mesas', 'QR das mesas', 0]];
  const qrSvg = text => { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch { return ''; } };

  return html`${header}
    <nav class="catbar"><div class="wrap ptabs">${TABS.map(([id, label, n]) => html`<button key=${id} class=${'ptab' + (tab === id ? ' on' : '')} onClick=${() => setTab(id)}>${label}${n > 0 && html`<span class="dot">${n}</span>`}</button>`)}</div></nav>
    <main class="wrap">
      <div class="kpis">
        <div class="kpi"><small>Faturamento hoje</small><b>${money(revenue)}</b></div>
        <div class="kpi"><small>Pedidos hoje</small><b>${valid.length}</b></div>
        <div class="kpi"><small>Ticket médio</small><b>${money(valid.length ? revenue / valid.length : 0)}</b></div>
        <div class="kpi"><small>Tempo até ficar pronto</small><b>${avgPrep ? Math.round(avgPrep / 60000) + ' min' : '—'}</b></div>
      </div>
      ${slow && html`<div class="note" style=${{ marginBottom: 12 }}>Os pedidos estão demorando para carregar. A lista pode estar desatualizada.</div>`}

      ${tab === 'pedidos' && html`<section class="panel-sec">
        ${orders === null ? html`<div class="empty">Carregando pedidos…</div>` : all.length === 0 ? html`<div class="note chefnote"><${Chef} size=${72} full=${true}/><p>Nenhum pedido ainda. Abra o cardápio, monte um pedido e toque em "Enviar para a cozinha": ele aparece aqui na hora.</p></div>` : html`
        <div class="board">
          ${[['novo', 'Novos'], ['cozinha', 'Na cozinha'], ['pronto', 'Prontos'], ['entregue', 'Entregues hoje']].map(([st, label]) => {
            const list = st === 'entregue' ? today.filter(o => o.status === 'entregue').slice(0, 8) : by(st).slice().reverse();
            return html`<div class="col" key=${st}><div class="col-h">${label}<span>${st === 'entregue' ? today.filter(o => o.status === 'entregue').length : list.length}</span></div>
              ${list.length === 0 ? html`<small class="muted" style=${{ padding: '4px 6px' }}>Nada aqui</small>` : list.map(o => html`<${Ticket} key=${o.id} o=${o} now=${now} fresh=${fresh[o.id]} onMove=${move} onCancel=${cancel}/>`)}
            </div>`; })}
        </div>`}
      </section>`}

      ${tab === 'chamados' && html`<section class="panel-sec">
        <h2>Mesas chamando</h2>
        ${openCalls.length === 0 ? html`<div class="note">Nenhuma mesa chamando agora. Quando um cliente tocar em "Chamar garçom" ou "Pedir a conta", aparece aqui.</div>` : html`<div class="calls">
          ${openCalls.map(c => html`<div class="call" key=${c.id}><b>Mesa ${c.mesa}</b><div class="what"><span class=${'tag ' + (c.tipo === 'conta' ? 'pop' : 'new')}>${c.tipo === 'conta' ? 'Pediu a conta' : 'Chamou o garçom'}</span> <span class="muted num">há ${mmss(now - c.em)}</span></div><button class="primary" style=${{ flex: 'none' }} onClick=${() => resolve(c)}><span>Atendido</span></button></div>`)}
        </div>`}
      </section>`}

      ${tab === 'cardapio' && html`<${Cadastro} db=${db} assets=${caps.assets} config=${config} orders=${all} say=${say}/>`}

      ${tab === 'resumo' && html`<section class="panel-sec">
        <h2>Mais pedidos hoje</h2>
        ${top.length === 0 ? html`<div class="note">Ainda sem pedidos hoje.</div>` : html`<div class="bars">${top.map(([n, q]) => html`<div class="bar" key=${n}><span>${n}</span><i style=${{ width: (q / topMax * 100) + '%' }}></i><b class="num">${q}</b></div>`)}</div>`}
        <h2>Pedidos por hora</h2>
        <div class="hours" role="img" aria-label="Pedidos por hora de hoje">${hours.map(([h, n]) => html`<div key=${h}><span>${n || ''}</span><i style=${{ height: (n / hMax * 80) + '%' }}></i><span>${h}h</span></div>`)}</div>
        <h2>Limpeza</h2>
        <div class="note">O banco guarda até 25 mil registros. Apague de vez em quando os pedidos de dias anteriores.</div>
        <div class="inline">${purge
          ? html`<span>Apagar ${all.filter(o => o.criadoEm < startOfDay(now)).length} pedidos de dias anteriores? Não dá para desfazer.</span><button class="ghost" onClick=${() => setPurge(false)}>Manter</button><button class="primary" style=${{ flex: 'none', background: 'var(--chili)', color: '#fff' }} onClick=${doPurge}><span>Apagar</span></button>`
          : html`<button class="ghost" onClick=${() => setPurge(true)}>Apagar pedidos de dias anteriores</button>`}</div>
      </section>`}

      ${tab === 'mesas' && html`<section class="panel-sec">
        <h2>QR code de cada mesa</h2>
        <div class="inline" style=${{ justifyContent: 'space-between' }}><span>Quantidade de mesas</span>
          <div class="stepper sm"><button onClick=${() => saveConfig({ mesas: Math.max(1, config.mesas - 1) })} aria-label="Menos mesas">−</button><b>${config.mesas}</b><button onClick=${() => saveConfig({ mesas: Math.min(60, config.mesas + 1) })} aria-label="Mais mesas">+</button></div></div>
        <div class="note">Cada QR abre o cardápio com o número da mesa já preenchido. Tire um print e imprima para colocar nas mesas.</div>
        <div class="qrs">${Array.from({ length: config.mesas }, (_, k) => k + 1).map(n => { const url = `${location.href.split('#')[0]}#mesa-${n}`; const svg = window.qrcode ? qrSvg(url) : '';
          return html`<div class="qr" key=${n}><b>Mesa ${n}</b>${svg ? html`<div style=${{ width: '100%', display: 'flex', justifyContent: 'center' }} dangerouslySetInnerHTML=${{ __html: svg }}></div>` : html`<small>QR indisponível</small>`}<small>${url}</small></div>`; })}</div>
      </section>`}
      <div style=${{ height: 40 }}></div>
    </main>
    ${toast && html`<div class="toast" role="status" style=${{ bottom: 'calc(24px + env(safe-area-inset-bottom,0px))' }}>${toast}</div>`}
  `;
}

function Root() {
  const caps = useCaps();
  const config = useMenuData(caps.db);
  const [route, setRoute] = useState(location.hash === '#painel' ? 'painel' : 'menu');
  useEffect(() => { const f = () => { setRoute(location.hash === '#painel' ? 'painel' : 'menu'); scrollTo(0, 0); }; addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  return html`<${DemoBar}/>${route === 'painel' ? html`<${Panel} caps=${caps} config=${config}/>` : html`<${MenuApp} caps=${caps} config=${config}/>`}`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${Root}/>`);
</script>
</body>
</html>
