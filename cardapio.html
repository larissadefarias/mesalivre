<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasa &amp; Manjericão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: topo com mesa + happy hour, abas de categoria fixas, grade de pratos, gaveta de pedido e barra flutuante. Identidade MesaLivre: vinho, coral e creme, com o Chef Livre */
:root{
  --bg:#F4F1E0; --surface:#FFFDF7; --surface-2:#EAE4CC; --ink:#2B1414; --muted:#6E5C55; --line:#E0D8BF;
  --brand:#6E1F1F; --on-brand:#FFF8EE; --accent:#E2574C; --on-accent:#FFFFFF; --chili:#B3261E; --ok:#2B8452;
  --shadow:0 10px 30px -12px rgba(43,20,20,.3);
  --f-display:"Rubik", "Arial Black", system-ui, sans-serif;
  --f-body:"Inter Tight", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1213; --surface:#251A1B; --surface-2:#312223; --ink:#F4EEE3; --muted:#BCA9A2; --line:#3E2C2D;
  --brand:#F2A096; --on-brand:#2B1414; --accent:#FF7B6E; --on-accent:#2B1414; --chili:#FFB0A4; --ok:#6FD39A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1213; --surface:#251A1B; --surface-2:#312223; --ink:#F4EEE3; --muted:#BCA9A2; --line:#3E2C2D;
  --brand:#F2A096; --on-brand:#2B1414; --accent:#FF7B6E; --on-accent:#2B1414; --chili:#FFB0A4; --ok:#6FD39A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Topo */
.top{padding-block:20px 8px;display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.logo h1{font-size:24px;font-weight:800;line-height:1}
.logo small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.pill:hover{border-color:var(--brand)}
.pill[disabled]{opacity:.55;cursor:not-allowed}
.table-tag{background:var(--brand);color:var(--on-brand);border-color:transparent}
.hh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:12px 16px}
.hh b{font-family:var(--f-display);font-size:18px}
.hh .clock{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

/* Busca e filtros */
.tools{display:flex;flex-direction:column;gap:10px;padding-block:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none;font-size:16px}
.search svg{flex:none;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sort{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}

/* Abas de categoria */
.catbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted)}
.cat.on{color:var(--ink);background:var(--surface-2)}
.cat .n{font-size:11px;margin-left:4px;opacity:.6}

/* Destaques */
.featured{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding-block:18px 6px}
.feat{position:relative;display:flex;gap:14px;align-items:center;text-align:left;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:14px;overflow:hidden}
.feat .plate{width:76px;height:76px}
.feat small{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700;opacity:.8}
.feat h3{font-size:18px;margin-top:2px}
.feat.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.feat.quiz{background:var(--ink);color:var(--bg)}

/* Seções e cards */
section.catsec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px);padding-block:22px 4px}
section.catsec h2{font-size:26px;font-weight:800;display:flex;align-items:baseline;gap:10px}
section.catsec h2 span{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:12px}
.card{display:flex;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{border-color:var(--brand);transform:translateY(-2px)}
.card.out{opacity:.6}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:17px;font-weight:700;line-height:1.2;padding-right:28px}
.card p{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.price{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.price s{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-right:4px}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.tag.hot{color:var(--chili)}
.tag.pop,.tag.hit{background:var(--accent);color:var(--on-accent)}
.tag.hit::before{content:"★ "}
.plate.photo{overflow:hidden;background:var(--surface-2);box-shadow:none}
.plate.photo img{width:100%;height:100%;object-fit:cover;display:block}
.note a{color:var(--brand);font-weight:600}
.tag.new{background:var(--brand);color:var(--on-brand)}
.tag.out{background:var(--chili);color:#fff}
.fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--chili)}
.qbadge{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;z-index:1}

.plate{flex:none;width:96px;height:96px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 5px rgba(255,255,255,.55),inset 0 0 0 7px rgba(0,0,0,.06)}
.plate.lg{width:min(220px,60vw);height:min(220px,60vw)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* Barra do pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;pointer-events:none}
.cartbar .wrap{display:flex;justify-content:center}
.cartbtn{pointer-events:auto;display:flex;align-items:center;gap:14px;width:min(520px,100%);background:var(--brand);color:var(--on-brand);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);font-weight:700}
.cartbtn .count{background:var(--on-brand);color:var(--brand);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.cartbtn .tot{margin-left:auto;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.spacer{height:110px}

/* Folhas e modais */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:88%}}
.sheet-in{padding:18px max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:24px}
.x{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.hero h2{font-size:28px;font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.group-h b{font-size:15px}
.req{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.req.bad{color:var(--chili)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt input{accent-color:var(--brand);width:18px;height:18px;flex:none}
.opt span{flex:1}
.opt em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;resize:vertical;min-height:64px}
.pairs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pair{flex:none;width:150px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13px;font-weight:600}
.pair .plate{width:56px;height:56px}
.addrow{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--bg);padding-block:12px 4px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.stepper button{width:36px;height:36px;border-radius:10px;font-size:20px;font-weight:600}
.stepper button:hover{background:var(--surface-2)}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.stepper.sm button{width:28px;height:28px;font-size:16px}
.primary{flex:1;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:600}

.line{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .plate{width:48px;height:48px}
.line .info{flex:1;min-width:0}
.line .info b{display:block}
.line .info small{display:block;color:var(--muted);font-size:12.5px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row.total{font-family:var(--f-display);font-weight:800;font-size:22px;padding-top:8px;border-top:1px dashed var(--line)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-transform:uppercase}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{accent-color:var(--brand);width:18px;height:18px}
.ok{color:var(--ok);font-weight:600;font-size:13px}
.bad{color:var(--chili);font-weight:600;font-size:13px}
pre.msg{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;margin:0;max-height:220px;overflow:auto;user-select:all}

/* Acompanhamento */
.track{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.step i{display:block;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
.step.done i{background:var(--ok)}
.step.now i::after{content:"";position:absolute;inset:0;background:var(--accent);animation:load 1.4s ease-in-out infinite}
.step.done,.step.now{color:var(--ink)}

/* Quiz */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;text-align:center}
.choice small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);animation:up .2s ease;max-width:calc(100% - 32px);text-align:center}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.card .plate{width:78px;height:78px}.grid{grid-template-columns:1fr}.logo h1{font-size:21px}}
.boot{padding:60px 16px;text-align:center;color:var(--muted)}
.chefchip{flex:none;display:grid;place-items:center;border-radius:50%;background:#F4F1E0;box-shadow:inset 0 0 0 2px #6E1F1F22}
.chefchip svg{width:100%;height:100%}
.madeby{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;padding-block:22px 4px}
.madeby b{font-family:var(--f-display);font-weight:800;color:var(--ink);letter-spacing:.02em}
.chefnote{display:flex;align-items:center;gap:12px}
.chefnote p{margin:0}
.ml-word{font-family:var(--f-display);font-weight:800;letter-spacing:.01em}
.demobar{background:var(--ink);color:var(--bg);font-size:13.5px}
.demobar .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:8px}
.demobar a,.demobar .linkbtn{color:inherit;font-weight:700;text-decoration:underline}
.foot{display:flex;justify-content:center;padding-block:8px 0}
.foot a,.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline}

/* Painel do restaurante */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.ptab.on{background:var(--ink);color:var(--bg)}
.ptab .dot{background:var(--chili);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding-block:6px 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--surface-2);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-weight:700}
.col-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ticket{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ticket.st-novo{border-left-color:var(--accent)}
.ticket.st-cozinha{border-left-color:var(--brand)}
.ticket.st-pronto{border-left-color:var(--ok)}
.ticket.late{border-left-color:var(--chili)}
.ticket.fresh{animation:pulse 1.2s ease 3}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent)}}
.t-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-h b{font-family:var(--f-display);font-size:20px}
.t-items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.t-items small{display:block;color:var(--muted);font-size:12.5px}
.t-items .obs{color:var(--chili);font-weight:600}
.t-act{display:flex;gap:6px}
.t-act .primary{padding:10px 12px}
.t-act .ghost{padding:9px 12px;font-size:13px}
.late-txt{color:var(--chili);font-weight:700}
.calls{display:flex;flex-direction:column;gap:8px}
.call{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.call b{font-family:var(--f-display);font-size:20px;min-width:72px}
.call .what{flex:1}
.mtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mtable th,.mtable td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.mtable th{border-top:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mtable input[type=number]{width:96px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;font-variant-numeric:tabular-nums}
.mtable .cell-item{display:flex;align-items:center;gap:10px;min-width:180px}
.mtable .plate{width:40px;height:40px}
.tablewrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.hours{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hours i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qr{background:#fff;color:#14231B;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--line)}
.qr svg{width:100%;height:auto;max-width:150px}
.qr b{font-family:var(--f-display);font-size:18px}
.qr small{font-size:10.5px;word-break:break-all;color:#56675D}
.panel-sec{display:flex;flex-direction:column;gap:12px;padding-block:6px 30px}
.panel-sec h2{font-size:22px}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:13.5px}
.state{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2)}
.state.on{background:var(--ok);color:#fff}
.ptabs.sub{padding-block:0 4px}
.ptabs.sub .ptab{border:1px solid var(--line)}
.dishcat{display:flex;flex-direction:column;gap:8px}
.dishcat h3{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.dishrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.dishrow.off{opacity:.6}
.dishrow .plate{width:64px;height:64px}
.dishrow .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.dishact{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ghost.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.ghost[disabled]{opacity:.45;cursor:not-allowed}
@media (max-width:640px){.dishrow{grid-template-columns:auto 1fr}.dishact{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}}
.catrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.catrow input[type=text]{flex:1;min-width:140px}
.form{gap:8px}
.form label:not(.switch){font-size:13px;font-weight:600;color:var(--muted)}
.form input[type=text],.form input[type=number],.form select,.catrow input[type=text],.optline input,.grow,.optgroup input,.optgroup select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:inherit;color:inherit}
.grow{flex:1;min-width:0;width:auto}
.form-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form-2>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.selos{display:flex;flex-wrap:wrap;gap:8px}
.selo{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13.5px}
.selo small{font-weight:500;color:var(--muted);font-size:11.5px}
.selo[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand);background:var(--surface)}
.selo.hit[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:none}
.selo.hit[aria-pressed="true"] small{color:inherit;opacity:.85}
.selo[disabled]{opacity:.45;cursor:not-allowed}
.optgroup{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.optline{display:grid;grid-template-columns:1fr 110px 38px;gap:8px;align-items:center}
.photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-row .plate.lg{width:120px;height:120px}
.filebtn{cursor:pointer;display:inline-block}
.primary.danger{background:var(--chili);color:#fff}
.danger-t{color:var(--chili);border-color:var(--chili)}
.hitnote{flex-wrap:wrap}
.hitnote p{flex:1;min-width:200px}

  if (sums.tip) L.push(`Serviço (10%): ${money(sums.tip)}`);
